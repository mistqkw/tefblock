<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TeFBlock banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12141c"/>
      <stop offset="100%" stop-color="#191c27"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7fc4f5"/>
      <stop offset="100%" stop-color="#5aa9e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#5aa9e6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5aa9e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="17.5" fill="none" stroke="#2b2f3d" stroke-width="1"/>

  <!-- terminal chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="18" fill="#1b1e28"/>
  <rect x="0" y="26" width="1200" height="18" fill="#1b1e28"/>
  <circle cx="28" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="22" r="6" fill="#febc2e"/>
  <circle cx="72" cy="22" r="6" fill="#28c840"/>
  <text x="600" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#8b90a3">block — TeFBlock</text>

  <!-- wordmark -->
  <text x="90" y="168" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="72" font-weight="700" fill="#e8e9ee">Te<tspan fill="url(#accentText)">F</tspan>Block</text>

  <!-- cursor -->
  <rect x="597" y="118" width="16" height="58" fill="#5aa9e6">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- tagline -->
  <text x="92" y="208" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" fill="#8b90a3">Block distracting apps &amp; sites. From your terminal.</text>

  <!-- prompt line -->
  <text x="92" y="254" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#6fb6ee">$ <tspan fill="#c9cdd8">block work</tspan></text>

  <!-- platform chips -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#c9cdd8">
    <rect x="90" y="272" width="88" height="28" rx="14" fill="#232732" stroke="#2b2f3d"/>
    <text x="134" y="291" text-anchor="middle">Linux</text>

    <rect x="188" y="272" width="112" height="28" rx="14" fill="#232732" stroke="#2b2f3d"/>
    <text x="244" y="291" text-anchor="middle">Windows</text>

    <rect x="310" y="272" width="150" height="28" rx="14" fill="#232732" stroke="#2b2f3d"/>
    <text x="385" y="291" text-anchor="middle">Textual TUI</text>
  </g>
</svg>
